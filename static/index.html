<!DOCTYPE html>
<html>

<head>
<title>DCCOMICSDLE</title>
<link rel="icon" href="/static/images/DC_Comics_logo.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<div id="logo">
    <img src="/static/images/Logo.png" alt="DCComicsdle Logo">
</div>

<style>

body{
font-family:Arial;
background:url("/static/images/background.jpg");
background-size: cover; /* or 100% 100% to stretch */
background-position: center;
background-repeat: no-repeat;
background-attachment: fixed;
color:white;
text-align:center;
}
#logo {
    margin-top: 20px;
}

#logo img {
    width: 450px;   /* adjust size */
    max-width: 90%;
    height: auto;
}
h1{
margin-top:10px;
}

#guessArea{
margin-top:10px;
}

input{
padding:5px;
font-size:16px;
width:250px;
border-radius:10px;

}

button{
padding:8px 12px;
font-size:16px;
border-radius:15px;
background:#333;
color:white;
border:4px solid #0078f9 ;
cursor:pointer;
}

title{
    background-image: url("/static/images/logo.png");
}

table{
    margin:auto;
    margin-top:30px;
    border-collapse:collapse;
    table-layout:fixed; /* fixed column widths */
}

td {
    width: 130px;
    height: 130px;
    padding: 2px;
    font-size: 14px;   /* base size */
    opacity: 0;
    transition: opacity 0.5s ease;
              /* remove default padding for flex */
}

td div {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    width: 100%;
    height: 100%;

    overflow: hidden;        /* ❌ no scrolling */
    word-break: break-word;  /* wrap long text */
    text-align: center;
}
th{
    padding:10px;
    width:120px;      /* fixed width for all cells */
    height:20px;      /* fixed height for all cells */
    align-items: center;
    vertical-align:center;
    text-align:center;
}

/* Image inside its own cell */
td img {
    width: 100%;
    height: 100%;
    object-fit:initial;
    border-radius: 20px;
    display: block;
}
.correct { border-radius: 20px; background-color:#2ecc71; color:white; }
.partial { border-radius: 20px; background-color:#f07735; color:white; }
.wrong { border-radius: 20px; background-color:#d3250a; color:white; }

.newer {
    border-radius: 20px;
    background-image: url("/static/images/UpArrow.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: white;}
.older {
    border-radius: 20px;
    background-image: url("/static/images/DownArrow.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: white;
}
.hint {
    display: none;
    font-size: 18px;
}


#hintsContainer{
    padding:1px 1px;
    border-radius:8px;
}

#hintsContainer button{
    padding:8px 8px;
    cursor:not-allowed;
    background:#333;
    color:white;
    border:4px solid #0078f9 ;
    border-radius:8px;
}

#hintsContainer button.enabled{
    cursor:pointer;
    background:#313d81;
}

#hintsContainer button.enabled:hover{
    background:#0078f9 ;
}

#oldgameContainer{
    margin-top:10px;
}

#oldgameContainer button{
    margin:5px;
    padding:8px 12px;
    cursor:not-allowed;
    background:#333;
    color:white;
    border:4px solid #0078f9 ;
    border-radius:20px;
    cursor:pointer;
}

#characterImageContainer{
    display:none;
    margin-top:10px;
}

#characterImage{
    width:300px;
    height:300px;
    object-fit:fill;
    border-radius:20px;
    border:5px solid #0078f9 ;
}

#legendBox{
    margin-top:40px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap:12px;
}

.legendCell{
    width:130px;
    height:130px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align:center;
}
</style>

</head>

<body>


<div id="hintsContainer">
    <button id="hintBtn1"disabled>QUOTE</button>
    <button id="hintBtn2" disabled>FIRST APPEARANCE</button>
    <button id="hintBtn3" disabled>DESCRIPTION</button>
    <p id="guessesLeftText"></p>

    <div style="margin-top:15px;">
        <p id="hint1" style="display:none;"></p>
        <p id="hint2" style="display:none;"></p>
        <p id="hint3" style="display:none;"></p>

        <!-- Quote will appear here -->
        <p id="quoteHint" class="hint" style="display:none; font-style:italic;"></p>
        <p id="firstappHint" class="hint" style="display:none; font-style:italic;"></p>
        <p id="descriptionHint" class="hint" style="display:none; font-style:italic;"></p>
    </div>

</div>

<div id="guessArea">

<input id="guessInput" list="charList" autocomplete="off">
<datalist id="charList"></datalist>
<button onclick="submitGuess()">GUESS</button>

</div>

<div id="oldgameContainer">

    <p id="oldgames"></p>

    <button id="oldGame" enabled>&lArr;</button>
    <span id="puzzleNumber">Puzzle #1</span>
    <button id="nextGame" enabled>&#8658;</button>

</div>

<div id="characterImageContainer">
    <img id="characterImage" src="" alt="Secret Character">
    <p id="Name" style="display:none; font-weight:bold; font-size:30px;"></p>
</div>



<table id="guessTable">

<tr>
<th></th>
<th>Gender</th>
<th>Type</th>
<th>Species</th>
<th>Powers</th>
<th>Origin</th>
<th>Affiliations</th>
<th>Year</th>
<th>Appearances</th>
</tr>

</table>



<script src="/static/game.js" defer></script>

<div id="legendBox">

<div class="legendItem">
    <div class="legendCell correct"><div>Correct</div></div>
</div>

<div class="legendItem">
    <div class="legendCell partial"><div>Partially Correct</div></div>
</div>

<div class="legendItem">
    <div class="legendCell wrong"><div>Incorrect</div></div>
</div>

<div class="legendItem">
    <div class="legendCell newer"><div>Answer is Higher</div></div>
</div>

<div class="legendItem">
    <div class="legendCell older"><div>Answer is Lower</div></div>
</div>

</div>
</body>
</html>
